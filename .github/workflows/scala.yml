name: Scala CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: sbt
      # On sbt 2.x, setup-sbt enables and caches sbt's disk cache by default (its README, "Opting
      # out of disk cache") — that's what lets unchanged code skip recompiling. Don't also cache
      # **/target: under sbt 2 target/ refers into the disk cache, and the two caches are saved
      # under different keys, so a restored target/ can point at entries the restored disk cache
      # lacks (ClassNotFoundException / "Not found" while loading the build).
      - uses: sbt/setup-sbt@v1
      - name: compile main
        run: sbt compile
      - name: tests
        run: sbt testFull
      - name: assembly
        run: sbt assembly
      - name: dependency updates report
        run: sbt dependencyUpdates
