name: Scala CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:
    types: [ opened ]

jobs:
  build:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: compile main
        run: sbt compile
      - name: tests
        run: sbt testFull
      - name: assembly
        run: sbt assembly
      - name: dependency updates report
        run: sbt dependencyUpdates
